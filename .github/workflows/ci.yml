name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The Makefile is the no-cmake path a fresh clone uses; if it rots,
      # the README lies.
      - name: Build via Makefile
        run: make clean && make sim tests

      - name: Portability invariant
        run: ./tools/check-portability.sh

      - name: Parse the fixture corpus
        run: ./bin/rsspaper-sim parse test/fixtures/feeds/*.xml

      - name: Compose an edition end to end
        run: |
          make fonts
          ./bin/rsspaper-sim compose --fresh --out "$RUNNER_TEMP/edition"

      - name: Drive the reader
        run: printf 'n\n1\nn\nb\ns\n2\nq\n' | ./bin/rsspaper-sim read --out "$RUNNER_TEMP/read"
