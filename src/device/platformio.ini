; The device build. Neither the Makefile nor CMake globs src/device, so this
; tree is invisible to the desktop build and cannot break it.
[platformio]
src_dir = .

[env:inkplate6flick]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions_rsspaper.csv
build_flags =
    -DARDUINO_INKPLATE6FLICK
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -std=gnu++17
    -I..
build_unflags = -std=gnu++11
build_src_filter = +<*.cpp> +<../core/**/*.cpp>
lib_deps = e-radionicacom/InkplateLibrary@^11.1.3
; No upload_port or monitor_port: PlatformIO finds the board itself, and a
; hardcoded /dev/cu.usbserial-N is one person's USB slot on one afternoon.
; Set RSSPAPER_PORT for tools/device.py, or --upload-port for pio, if a
; machine has more than one board attached.
monitor_speed = 115200

; The portrait build, for deciding the orientation question on the board
; rather than from PNGs. The panel raster stays landscape; device_display.cpp
; rotates in the blit and device_input.cpp rotates touch back.
[env:inkplate6flick-portrait]
extends = env:inkplate6flick
build_flags =
    ${env:inkplate6flick.build_flags}
    -DRSSPAPER_PORTRAIT=1
