; The device build. Neither the Makefile nor CMake globs src/device, so this
; tree is invisible to the desktop build and cannot break it.
[platformio]
src_dir = .

[env:inkplate6flick]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions_diarium.csv
build_flags =
    -DARDUINO_INKPLATE6FLICK
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -std=gnu++17
    -I..
build_unflags = -std=gnu++11
build_src_filter = +<*.cpp> +<../core/**/*.cpp>
lib_deps = e-radionicacom/InkplateLibrary@^11.1.3
; No upload_port or monitor_port: PlatformIO finds the board itself, and a
; hardcoded /dev/cu.usbserial-N is one person's USB slot on one afternoon.
; Set DIARIUM_PORT for tools/device.py, or --upload-port for pio, if a
; machine has more than one board attached.
monitor_speed = 115200
