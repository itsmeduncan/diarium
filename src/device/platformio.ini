; The device build. Neither the Makefile nor CMake globs src/device, so this
; tree is invisible to the desktop build and cannot break it.
[platformio]
src_dir = .

[env:inkplate6flick]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions_rsspaper.csv
build_flags =
    -DARDUINO_INKPLATE6FLICK
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -std=gnu++17
    -I..
build_unflags = -std=gnu++11
build_src_filter = +<*.cpp> +<../core/**/*.cpp>
lib_deps = e-radionicacom/InkplateLibrary@^11.1.3
upload_port = /dev/cu.usbserial-110
monitor_port = /dev/cu.usbserial-110
monitor_speed = 115200
